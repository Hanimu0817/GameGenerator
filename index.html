```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Generator</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">


        <!-- Website Title -->

        <h1>🎮 Game Generator</h1>

        <p class="subtitle">
            Can't decide what to play? Let the generator choose!
        </p>


        <!-- Controls -->

        <div class="controls">


            <label for="genre">
                Choose a Genre:
            </label>


            <select id="genre">

                <option value="Random">
                    🎲 Random
                </option>

                <option value="Action">
                    ⚔️ Action
                </option>

                <option value="RPG">
                    🧙 RPG
                </option>

                <option value="Survival">
                    🏕️ Survival
                </option>

                <option value="Strategy">
                    🧠 Strategy
                </option>

                <option value="Adventure">
                    🗺️ Adventure
                </option>

                <option value="Horror">
                    👻 Horror
                </option>

                <option value="Gun-Like">
                    🔫 Gun-Like
                </option>

                <option value="FTG">
                    🥊 FTG
                </option>

                <option value="Music Game">
                    🎵 Music Game
                </option>

            </select>


            <button id="generateButton">

                🎲 Generate Game

            </button>


        </div>


        <!-- Result -->

        <div id="result" class="result">


            <h2>
                Your Game
            </h2>


            <p>
                Click the button to generate a game!
            </p>


        </div>


    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>


</body>

</html>
```
