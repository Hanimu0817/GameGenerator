```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎮 Game Generator</h1>

        <p class="subtitle">
            Can't decide what to play? Let the generator choose!
        </p>

        <div class="controls">

            <label for="genre">
                Choose a Genre:
            </label>

            <select id="genre">

                <option value="Random">🎲 Random</option>

                <option value="Action">⚔️ Action</option>

                <option value="RPG">🧙 RPG</option>

                <option value="Survival">🏕️ Survival</option>

                <option value="Strategy">🧠 Strategy</option>

                <option value="Adventure">🗺️ Adventure</option>

                <option value="Horror">👻 Horror</option>

            </select>

            <button id="generateButton">
                🎲 Generate Game
            </button>

        </div>

        <div id="result" class="result">

            <h2>Your Game</h2>

            <p>
                Click the button to generate a game!
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
```
